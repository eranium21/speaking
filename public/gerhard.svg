<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none">
  <!-- Background circle -->
  <circle cx="100" cy="120" r="96" fill="#263A52" opacity="0.08"/>

  <!-- Body / Jacket -->
  <path d="M40 240 C40 190 60 175 100 170 C140 175 160 190 160 240" fill="#CF4B3A"/>
  <!-- Jacket collar -->
  <path d="M75 175 L100 195 L125 175" fill="none" stroke="#B53D2F" stroke-width="3" stroke-linecap="round"/>
  <!-- Jacket zipper -->
  <line x1="100" y1="195" x2="100" y2="240" stroke="#B53D2F" stroke-width="2"/>
  <!-- Jacket grey panels -->
  <path d="M40 240 C40 200 55 185 75 178 L65 240 Z" fill="#6B7280" opacity="0.3"/>
  <path d="M160 240 C160 200 145 185 125 178 L135 240 Z" fill="#6B7280" opacity="0.3"/>

  <!-- Neck -->
  <rect x="88" y="155" width="24" height="22" rx="8" fill="#E8B89D"/>

  <!-- Head -->
  <ellipse cx="100" cy="110" rx="52" ry="56" fill="#E8B89D"/>

  <!-- Bald head highlight -->
  <ellipse cx="96" cy="72" rx="30" ry="16" fill="#F0C9AD" opacity="0.5"/>

  <!-- Ears -->
  <ellipse cx="48" cy="115" rx="10" ry="14" fill="#E0A88A"/>
  <ellipse cx="152" cy="115" rx="10" ry="14" fill="#E0A88A"/>

  <!-- Sunglasses -->
  <!-- Bridge -->
  <path d="M85 108 Q100 112 115 108" fill="none" stroke="#1B2A3E" stroke-width="3" stroke-linecap="round"/>
  <!-- Left lens -->
  <rect x="58" y="98" width="30" height="22" rx="6" fill="#CF4B3A" opacity="0.85"/>
  <rect x="58" y="98" width="30" height="22" rx="6" fill="none" stroke="#1B2A3E" stroke-width="2.5"/>
  <!-- Right lens -->
  <rect x="112" y="98" width="30" height="22" rx="6" fill="#CF4B3A" opacity="0.85"/>
  <rect x="112" y="98" width="30" height="22" rx="6" fill="none" stroke="#1B2A3E" stroke-width="2.5"/>
  <!-- Arms -->
  <line x1="48" y1="108" x2="58" y2="108" stroke="#1B2A3E" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="142" y1="108" x2="152" y2="108" stroke="#1B2A3E" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Lens shine -->
  <rect x="62" y="101" width="8" height="4" rx="2" fill="white" opacity="0.3"/>
  <rect x="116" y="101" width="8" height="4" rx="2" fill="white" opacity="0.3"/>

  <!-- Smile -->
  <path d="M80 132 Q100 148 120 132" fill="none" stroke="#1B2A3E" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Cheeks -->
  <circle cx="72" cy="128" r="8" fill="#E87068" opacity="0.25"/>
  <circle cx="128" cy="128" r="8" fill="#E87068" opacity="0.25"/>

  <!-- Nose -->
  <path d="M98 118 Q100 126 104 122" fill="none" stroke="#D4A088" stroke-width="2" stroke-linecap="round"/>

  <!-- Eyebrows (subtle, above sunglasses) -->
  <path d="M62 92 Q73 87 88 92" fill="none" stroke="#C49478" stroke-width="2" stroke-linecap="round"/>
  <path d="M112 92 Q127 87 138 92" fill="none" stroke="#C49478" stroke-width="2" stroke-linecap="round"/>
</svg>
